# Auto-publishes a tagged release to RubyGems.
#
# Trigger: any tag matching `v*` is pushed. The workflow builds the
# gem and pushes it to https://rubygems.org.
#
# Setup (one-time, by the maintainer):
#
#   1. Generate a RubyGems API key with `push` scope at
#      https://rubygems.org/profile/api_keys
#   2. Add it to this repo as a secret named `RUBYGEMS_API_KEY`
#      (Settings → Secrets and variables → Actions → New secret).
#
# After that, releasing is just:
#
#   git tag -a v3.0.0.6 -m "..."
#   git push origin v3.0.0.6
#
# The job verifies that the tag's version matches `lib/sfml/version.rb`
# before pushing — prevents accidentally tagging without bumping
# (or vice versa).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Publish gem to RubyGems
    runs-on: ubuntu-latest
    if: github.repository == 'sOM2H/ruby-sfml'

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Verify tag matches lib/sfml/version.rb
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          gem_version=$(ruby -Ilib -rsfml/version -e 'print SFML::VERSION')
          if [ "$tag_version" != "$gem_version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match SFML::VERSION='$gem_version'"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches SFML::VERSION=$gem_version"

      - name: Build gem
        run: gem build ruby-sfml.gemspec

      - name: Publish to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push ruby-sfml-*.gem
